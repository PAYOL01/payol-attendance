<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payol Attendance</title>
</head>

<body>

<h1>Payol Attendance</h1>

<input id="employeeId" placeholder="Employee ID">
<br><br>

<input id="password" type="password" placeholder="Password">
<br><br>

<button onclick="login()">Login</button>

<p id="message"></p>

<hr>

<button onclick="setOfficeLocation()">📍 function setOfficeLocation() {

  document.getElementById("locationMessage").innerText =
    "📍 Location le rahe hain...";

  navigator.geolocation.getCurrentPosition(

    async function(position) {

      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;

      try {

        const response = await fetch(
          SUPABASE_URL + "/rest/v1/office_settings?id=eq.1",
          {
            method: "PATCH",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY,
              "Content-Type": "application/json",
              "Prefer": "return=representation"
            },
            body: JSON.stringify({
              latitude: latitude,
              longitude: longitude,
              radius_meters: 100
            })
          }
        );

        const result = await response.text();

        if (!response.ok) {
          document.getElementById("locationMessage").innerText =
            "❌ Save Error: " + result;
          return;
        }

        document.getElementById("locationMessage").innerText =
          "✅ Office Location Successfully Set";

      } catch (error) {

        document.getElementById("locationMessage").innerText =
          "❌ Connection Error: " + error.message;

      }
    },

    function(error) {

      document.getElementById("locationMessage").innerText =
        "❌ GPS Error: " + error.message;

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}

<p id="locationMessage"></p>

<script>

const SUPABASE_URL = "https://nkbbcygtuaejcuquwhpi.supabase.co";
const SUPABASE_KEY = "sb_publishable_wac3Xs5ba2V6slW990JvHQ_-4bsLKtS";

async function login() {

  const employeeId =
    document.getElementById("employeeId").value.trim();

  const password =
    document.getElementById("password").value;

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/employees?employee_id=eq." +
    encodeURIComponent(employeeId) +
    "&password=eq." +
    encodeURIComponent(password) +
    "&select=*",
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  if (!response.ok) {
    document.getElementById("message").innerText =
      "❌ Supabase connection error";
    return;
  }

  const data = await response.json();

  if (data.length > 0) {
    document.getElementById("message").innerText =
      "✅ Login Successful — " + data[0].name;
  } else {
    document.getElementById("message").innerText =
      "❌ Username ya Password galat hai";
  }
}


function setOfficeLocation() {

  document.getElementById("locationMessage").innerText =
    "📍 Location permission ka wait karein...";

  navigator.geolocation.getCurrentPosition(

    async function(position) {

      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;

      const response = await fetch(
        SUPABASE_URL + "/rest/v1/office_settings?id=eq.1",
        {
          method: "PATCH",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },

          body: JSON.stringify({
            latitude: latitude,
            longitude: longitude,
            radius_meters: 100
          })
        }
      );

      if (response.ok) {

        document.getElementById("locationMessage").innerText =
          "✅ Office Location Successfully Set";

      } else {

        document.getElementById("locationMessage").innerText =
          "❌ Location save nahi hui";

      }

    },

    function(error) {

      document.getElementById("locationMessage").innerText =
        "❌ Location permission allow karein";

    },

    {
      enableHighAccuracy: true,
      timeout: 15000
    }
  );
}

</script>

</body>
</html>
