function $(id){
  return document.getElementById(id);
}


function todayString(){

  const d = new Date();

  return d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,"0") + "-" +
    String(d.getDate()).padStart(2,"0");
}


function monthString(date){

  return date.getFullYear() + "-" +
    String(date.getMonth()+1).padStart(2,"0");
}


function formatDate(date){

  if(!date) return "";

  const d = new Date(date + "T00:00:00");

  return String(d.getDate()).padStart(2,"0") +
    "/" +
    String(d.getMonth()+1).padStart(2,"0") +
    "/" +
    d.getFullYear();
}


function formatTime(t){

  if(!t) return "-";

  return String(t).slice(0,5);
}


function money(n){

  return "₹" +
    Number(n || 0).toLocaleString("en-IN");
}


function showToast(message,type=""){

  $("toast").textContent = message;

  $("toast").className =
    "toast " + type;

  $("toast").classList.remove("hidden");

  setTimeout(()=>{
    $("toast").classList.add("hidden");
  },3500);
}


function showPage(id){

/* =========================================================

========================================================= */

async function checkSession(){

  const saved =
    localStorage.getItem("payol_session");


  if(!saved)
    return;


  try{

    const session =
      JSON.parse(saved);


    if(session.admin){

      isAdmin = true;

      currentUser =
        session.user;

      await startApp();

    }else{

      const loginId =
        session.user?.employee_id;


      if(!loginId){

        localStorage.removeItem(
          "payol_session"
        );

        return;
      }


      const result =
        await db
          .from("employees")
          .select("*")
          .eq(
            "employee_id",
            loginId
          )
          .maybeSingle();


      if(result.data){

        isAdmin = false;

        currentUser =
          result.data;

        await startApp();

      }else{

        localStorage.removeItem(
          "payol_session"
        );

      }

    }

  }catch(e){

    console.error(e);

    localStorage.removeItem(
      "payol_session"
    );

  }
}

  /* =====================================================
     ADD EMPLOYEE

  else{

        .maybeSingle();

      showToast(
        "Ye Employee ID already exist karti hai",

    /*
      VERY IMPORTANT:

      id ko bilkul nahi bhejna.

      employee_id me PAYOL01 / ABC123 / kuch bhi

/* =========================================================
   OFFICE GPS
========================================================= */

async function loadOfficeSettings(){

  const result =
    await db
      .from("office_settings")
      .select("*")
      .eq("id",1)
      .maybeSingle();


  if(result.error){

    console.error(result.error);

    return;
  }


  officeSettings =
    result.data || {

      id:1,

      latitude:null,

      longitude:null,

      radius_meters:100

    };


  if($("officeLat")){

    $("officeLat").value =
      officeSettings.latitude ?? "";

    $("officeLng").value =
      officeSettings.longitude ?? "";

    $("officeRadius").value =
      officeSettings.radius_meters || 100;

  }
}


function getOfficeGPS(){

  if(!navigator.geolocation){

    showToast(
      "GPS supported nahi hai",
      "error"
    );

    return;
  }


  $("officeGpsMessage").textContent =
    "GPS location मिल रही है...";


  navigator.geolocation.getCurrentPosition(

    position=>{

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      $("officeLat").value =
        lat.toFixed(8);


      $("officeLng").value =
        lng.toFixed(8);


      $("officeGpsMessage").textContent =
        "Location received: " +
        lat.toFixed(6) +
        ", " +
        lng.toFixed(6);

    },


    error=>{

      $("officeGpsMessage").textContent =
        "GPS Error: " +
        error.message;


      showToast(
        "GPS permission/location check kijiye",
        "error"
      );

    },


    {
      enableHighAccuracy:true,

      timeout:15000,

      maximumAge:0
    }

  );

}


async function saveOfficeSettings(){

  const lat =
    Number($("officeLat").value);

  const lng =
    Number($("officeLng").value);

  const radius =
    Number($("officeRadius").value);


  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ){

    showToast(
      "Office latitude/longitude डालिए",
      "error"
    );

    return;
  }


  if(
    !Number.isFinite(radius) ||
    radius <= 0
  ){

    showToast(
      "Valid radius डालिए",
      "error"
    );

    return;
  }


  const result =
    await db
      .from("office_settings")
      .upsert({

        id:1,

        latitude:lat,

        longitude:lng,

        radius_meters:
          Math.round(radius)

      });


  if(result.error){

    showToast(
      "Office save failed: " +
      result.error.message,
      "error"
    );

    return;
  }


  await loadOfficeSettings();


  showToast(
    "Office GPS settings saved",
    "success"
  );
}


/* =========================================================
   DISTANCE
========================================================= */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const toRad =
    deg => deg * Math.PI / 180;


  const dLat =
    toRad(lat2-lat1);


  const dLon =
    toRad(lon2-lon1);


  const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(toRad(lat1)) *
    Math.cos(toRad(lat2)) *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );


  return R*c;
}

/* =========================================================
   TODAY ATTENDANCE
   Attendance employee_id = employees.id UUID
========================================================= */

async function updateTodayAttendanceStatus(){

  const date =
    todayString();


  const result =
    await db
      .from("attendance")
      .select("*")
      .eq(
        "employee_id",
        String(currentUser.id)
      )
      .eq(
        "attendance_date",
        date
      )
      .maybeSingle();


  if(result.error){

    console.error(result.error);

    $("attendanceStatus").textContent =
      "Attendance status unavailable";

    $("attendanceSub").textContent =
      result.error.message;

    return;
  }


  const row =
    result.data;


  const inDone =
    !!row?.in_time;


  const outDone =
    !!row?.out_time;


  $("todayStatus").textContent =
    outDone
      ? "OUT"
      : inDone
        ? "IN"
        : "Absent";


  if(!row){

    $("attendanceStatus").textContent =
      "Not Marked";


    $("attendanceSub").textContent =
      "Aaj attendance mark kijiye";

  }else if(
    inDone &&
    !outDone
  ){

    $("attendanceStatus").textContent =
      "IN Marked";


    $("attendanceSub").textContent =
      "IN: " +
      formatTime(row.in_time) +
      " — OUT pending";

  }else{

    $("attendanceStatus").textContent =
      "Attendance Complete";


    $("attendanceSub").textContent =
      "IN: " +
      formatTime(row.in_time) +
      " | OUT: " +
      formatTime(row.out_time);

  }


  $("inButton").disabled =
    inDone;


  $("outButton").disabled =
    !inDone || outDone;


  $("inButton")
    .classList.toggle(
      "disabledBtn",
      inDone
    );


  $("outButton")
    .classList.toggle(
      "disabledBtn",
      !inDone || outDone
    );
}


/* =========================================================
   ATTENDANCE
========================================================= */

async function markAttendance(type){

  if(
    !currentUser ||
    isAdmin
  ){

    return;
  }


  await loadOfficeSettings();


  if(
    !officeSettings ||
    officeSettings.latitude === null ||
    officeSettings.longitude === null
  ){

    showToast(
      "Admin ne office GPS set nahi kiya hai",
      "error"
    );

    return;
  }


  const today =
    todayString();


  /*
    Attendance me employee_id:
    employees.id ka UUID
  */

  const employeeUUID =
    String(currentUser.id);


  /* First DB check */

  const existingResult =
    await db
      .from("attendance")
      .select("*")
      .eq(
        "employee_id",
        employeeUUID
      )
      .eq(
        "attendance_date",
        today
      )
      .maybeSingle();


  if(existingResult.error){

    showToast(
      "Attendance check failed: " +
      existingResult.error.message,
      "error"
    );

    return;
  }


  const existing =
    existingResult.data;


  if(
    type === "IN" &&
    existing?.in_time
  ){

    showToast(
      "Aaj ka IN already marked hai",
      "error"
    );

    await updateTodayAttendanceStatus();

    return;
  }


  if(
    type === "OUT" &&
    !existing?.in_time
  ){

    showToast(
      "Pehle IN mark kijiye",
      "error"
    );

    return;
  }


  if(
    type === "OUT" &&
    existing?.out_time
  ){

    showToast(
      "Aaj ka OUT already marked hai",
      "error"
    );

    return;
  }


  if(!navigator.geolocation){

    showToast(
      "Is device me GPS available nahi hai",
      "error"
    );

    return;
  }


  $("gpsInfo").textContent =
    "GPS location check ho rahi hai...";


  navigator.geolocation.getCurrentPosition(

    async position=>{

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;


      const distance =
        distanceMeters(

          lat,

          lng,

          Number(officeSettings.latitude),

          Number(officeSettings.longitude)

        );


      $("gpsInfo").textContent =
        "Distance: " +
        Math.round(distance) +
        " meters | Accuracy: " +
        Math.round(accuracy) +
        " meters";


      if(
        distance >
        Number(
          officeSettings.radius_meters || 100
        )
      ){

        showToast(
          "Office se bahar hain. Distance: " +
          Math.round(distance) +
          " meters",
          "error"
        );

        return;
      }


      /* SECOND CHECK */

      const secondCheck =
        await db
          .from("attendance")
          .select("*")
          .eq(
            "employee_id",
            employeeUUID
          )
          .eq(
            "attendance_date",
            today
          )
          .maybeSingle();


      if(secondCheck.error){

        showToast(
          "Attendance verification failed: " +
          secondCheck.error.message,
          "error"
        );

        return;
      }


      const row =
        secondCheck.data;


      if(
        type === "IN" &&
        row?.in_time
      ){

        showToast(
          "IN already marked",
          "error"
        );

        await updateTodayAttendanceStatus();

        return;
      }


      if(
        type === "OUT" &&
        (
          !row?.in_time ||
          row?.out_time
        )
      ){

        showToast(
          row?.out_time
            ? "OUT already marked"
            : "Pehle IN mark kijiye",
          "error"
        );

        await updateTodayAttendanceStatus();

        return;
      }


      const now =
        new Date();


      const time =
        now.toTimeString()
          .slice(0,8);


      let result;


      /* IN */

      if(type === "IN"){

        if(row){

          result =
            await db
              .from("attendance")
              .update({

                in_time:time,

                latitude:lat,

                longitude:lng,

                attendance_type:"IN"

              })
              .eq(
                "employee_id",
                employeeUUID
              )
              .eq(
                "attendance_date",
                today
              )
              .is(
                "in_time",
                null
              );

        }else{

          result =
            await db
              .from("attendance")
              .insert([{

                employee_id:
                  employeeUUID,

                attendance_date:
                  today,

                attendance_type:
                  "IN",

                in_time:
                  time,

                out_time:
                  null,

                latitude:
                  lat,

                longitude:
                  lng

              ]);

        }

      }


      /* OUT */

      else{

        result =
          await db
            .from("attendance")
            .update({

              out_time:
                time,

              latitude:
                lat,

              longitude:
                lng

            })
            .eq(
              "employee_id",
              employeeUUID
            )
            .eq(
              "attendance_date",
              today
            )
            .not(
              "in_time",
              "is",
              null
            )
            .is(
              "out_time",
              "is",
              null
            );

      }


      if(result.error){

        console.error(
          "ATTENDANCE ERROR:",
          result.error
        );


        if(
          result.error.code === "23505"
        ){

          showToast(
            "Attendance already marked",
            "error"
          );

        }else{

          showToast(
            "Attendance failed: " +
            result.error.message,
            "error"
          );

        }

        return;
      }


      showToast(
        type +
        " marked successfully",
        "success"
      );


      await updateTodayAttendanceStatus();

    },


    error=>{

      $("gpsInfo").textContent =
        "GPS Error: " +
        error.message;


      showToast(
        "GPS permission ON kijiye",
        "error"
      );

    },


    {
      enableHighAccuracy:true,

      timeout:20000,

      maximumAge:0
    }

  );
}

/* =========================================================
   CSV
========================================================= */

function exportCSV(){

  if(!lastAttendanceRows.length){

    showToast(
      "Export karne ke liye data nahi hai",
      "error"
    );

    return;
  }


  let csv =
    "Date,Employee ID,Name,IN,OUT,Status\n";


  lastAttendanceRows.forEach(r=>{

    const e =
      employees.find(
        x =>
          String(x.id) ===
          String(r.employee_id)
      ) || {};


    const status =
      r.out_time
        ? "Complete"
        : r.in_time
          ? "IN"
          : "Absent";


    csv +=
      [

        r.attendance_date,

        e.employee_id || "",

        e.name || "",

        r.in_time || "",

        r.out_time || "",

        status

      ]
      .map(csvEscape)
      .join(",") +
      "\n";

  });


  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;


  a.download =
    "payol-attendance-" +
    todayString() +
    ".csv";


  a.click();


  URL.revokeObjectURL(url);
}


function csvEscape(value){

  const s =
    String(value ?? "");


  return '"' +
    s.replace(/"/g,'""') +
    '"';
}

========================================================= */

async function changeMonth(direction){

  calendarDate.setMonth(
    calendarDate.getMonth() +
    direction
  );


  await renderCalendar();
}


async function renderCalendar(){

  const year =
    calendarDate.getFullYear();


  const month =
    calendarDate.getMonth();


  const monthNames = [

    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"

  ];


  $("calendarTitle").textContent =
    monthNames[month] +
    " " +
    year;


  const first =
    new Date(
      year,
      month,
      1
    );


  const last =
    new Date(
      year,
      month+1,
      0
    );


  const startDay =
    first.getDay();


  const totalDays =
    last.getDate();


  const startDate =
    year + "-" +
    String(month+1).padStart(2,"0") +
    "-01";


  const endDate =
    year + "-" +
    String(month+1).padStart(2,"0") +
    "-" +
    String(totalDays).padStart(2,"0");


  const employeeUUID =
    String(currentUser.id);


  const result =
    await db
      .from("attendance")
      .select("*")
      .eq(
        "employee_id",
        employeeUUID
      )
      .gte(
        "attendance_date",
        startDate
      )
      .lte(
        "attendance_date",
        endDate
      );


  const attendance =
    result.data || [];


  const leaveResult =
    await db
      .from("leave_requests")
      .select("*")
      .eq(
        "employee_id",
        employeeUUID
      )
      .gte(
        "leave_date",
        startDate
      )
      .lte(
        "leave_date",
        endDate
      );


  const leaves =
    leaveResult.data || [];


  const days = [

    "Sun",
    "Mon",
    "Tue",
    "Wed",
    "Thu",
    "Fri",
    "Sat"

  ];


  let html = "";


  days.forEach(d=>{

    html +=
      `<div class="calDayName">${d}</div>`;

  });


  for(
    let i=0;
    i<startDay;
    i++
  ){

    html +=
      `<div></div>`;

  }


  for(
    let day=1;
    day<=totalDays;
    day++
  ){

    const date =
      year + "-" +
      String(month+1).padStart(2,"0") +
      "-" +
      String(day).padStart(2,"0");


    const a =
      attendance.find(
        x =>
          x.attendance_date ===
          date
      );


    const h =
      holidays.find(
        x =>
          x.holiday_date ===
          date
      );


    const l =
      leaves.find(
        x =>
          x.leave_date ===
          date &&
          x.status === "APPROVED"
      );


    let cls =
      "calDay";


    let mark = "";


    if(h){

      cls += " holiday";


      mark =
        "🎉 " +
        (
          h.holiday_name ||
          h.name ||
          "Holiday"
        );

    }else if(l){

      cls += " leave";

      mark =
        "LEAVE";

    }else if(a?.in_time){

      cls += " present";


      mark =
        "IN " +
        formatTime(a.in_time) +

        (
          a.out_time
            ? "<br>OUT " +
              formatTime(a.out_time)
            : ""
        );

    }else{

      cls += " absent";

      mark =
        "Absent";

    }


    html += `

      <div class="${cls}">

        <div class="calDate">
          ${day}
        </div>

        <div class="calMark">
          ${mark}
        </div>

      </div>

    `;

  }


  $("calendarGrid").innerHTML =
    html;
}

function setupSalaryMonths(){

  const select =
    $("salaryMonth");


  if(select.options.length)
    return;


  const now =
    new Date();


  for(
    let i=0;
    i<12;
    i++
  ){

    const d =
      new Date(
        now.getFullYear(),
        now.getMonth()-i,
        1
      );


    const value =
      d.getFullYear() +
      "-" +
      String(d.getMonth()+1)
        .padStart(2,"0");


    const text =
      d.toLocaleString(
        "en-IN",
        {
          month:"long",
          year:"numeric"
        }
      );


    const option =
      document.createElement("option");


    option.value =
      value;


    option.textContent =
      text;


    select.appendChild(option);
  }
}


async function loadSalaryReport(){

  if(!$("salaryMonth"))
    return;


  const selected =
    $("salaryMonth").value ||
    monthString(new Date());


  const [year,month] =
    selected
      .split("-")
      .map(Number);


  const days =
    new Date(
      year,
      month,
      0
    ).getDate();


  const start =
    selected +
    "-01";


  const end =
    selected +
    "-" +
    String(days)
      .padStart(2,"0");


  const attendanceResult =
    await db
      .from("attendance")
      .select("*")
      .gte(
        "attendance_date",
        start
      )
      .lte(
        "attendance_date",
        end
      );


  const leaveResult =
    await db
      .from("leave_requests")
      .select("*")
      .eq(
        "status",
        "APPROVED"
      )
      .gte(
        "leave_date",
        start
      )
      .lte(
        "leave_date",
        end
      );


  const att =
    attendanceResult.data || [];


  const leaves =
    leaveResult.data || [];


  $("salaryTable").innerHTML =

    employees.map(e=>{

      const employeeUUID =
        String(e.id);


      const present =
        att.filter(
          r =>
            String(r.employee_id) ===
            employeeUUID &&
            !!r.in_time
        ).length;


      const leave =
        leaves.filter(
          r =>
            String(r.employee_id) ===
            employeeUUID
        ).length;


      const salary =
        Number(
          e.salary || 0
        );


      const estimated =
        days > 0
          ? Math.round(
              salary *
              (present + leave) /
              days
            )
          : 0;


      return `

        <tr>

          <td>
            ${escapeHtml(
              e.employee_id || ""
            )}
          </td>

          <td>
            ${escapeHtml(
              e.name || ""
            )}
          </td>

          <td>
            ${escapeHtml(
              e.post || "-"
            )}
          </td>

          <td>
            ${money(salary)}
          </td>

          <td>
            ${present}
          </td>

          <td>
            ${leave}
          </td>

          <td>
            <b>
              ${money(estimated)}
            </b>
          </td>

        </tr>

      `;

    }).join("");
}


/* =========================================================
   SECURITY HELPERS
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeJs(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}
