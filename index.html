/* ================================

async function getOffice(){

  const {data,error} =
    await db
      .from("office_settings")

/* ================================
   GPS DISTANCE
================================ */

function distance(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const toRad =
    x => x * Math.PI / 180;

  const a =
    Math.sin(
      toRad(lat2-lat1)/2
    ) ** 2 +

    Math.cos(toRad(lat1)) *
    Math.cos(toRad(lat2)) *
    Math.sin(
      toRad(lon2-lon1)/2
    ) ** 2;

  return Math.round(
    R * 2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    )
  );
}


/* ================================
   GET GPS
================================ */

function getGPS(){

  return new Promise((resolve,reject)=>{

    if(!navigator.geolocation){

      reject(
        new Error(
          "Browser GPS support nahi karta"
        )
      );

      return;
    }

    navigator.geolocation.getCurrentPosition(

      position=>{

        resolve({

          lat:position.coords.latitude,

          lon:position.coords.longitude,

          accuracy:
            Math.round(
              position.coords.accuracy
            )

        });

      },

      error=>{

        reject(
          new Error(
            error.message ||
            "GPS permission error"
          )
        );

      },

      {
        enableHighAccuracy:true,
        timeout:15000,
        maximumAge:0
      }

    );

  });
}


/* ================================
   LOCATION CHECK
================================ */

async function locate(){

  const office =
    await getOffice();

  if(
    office.latitude == null ||
    office.longitude == null
  ){

    throw new Error(
      "Admin ne office GPS set nahi kiya hai"
    );

  }

  const gps =
    await getGPS();

  const dist =
    distance(
      gps.lat,
      gps.lon,
      Number(office.latitude),
      Number(office.longitude)
    );

  return {

    ...gps,

    dist,

    radius:
      Number(
        office.radius_meters || 100
      )

  };
}


/* ================================
   TODAY ATTENDANCE
================================ */

async function todayAttendance(){

  const {data,error} =
    await db
      .from("attendance")
      .select("*")
      .eq("employee_id",session.id)
      .eq("attendance_date",today());

  if(error) throw error;

  const rows = data || [];

  const inRow =
    rows.find(
      x => (x.attendance_type || "IN") === "IN"
    );

  const outRow =
    rows.find(
      x => x.attendance_type === "OUT"
    );

  return {
    inRow,
    outRow,
    rows
  };
}


/* ================================
   STATUS
================================ */

function status(inTime,outTime){

  if(!inTime && !outTime)
    return "Absent";

  if(!inTime || !outTime)
    return "Incomplete";

  const [ih,im] =
    String(inTime)
    .split(":")
    .map(Number);

  const [oh,om] =
    String(outTime)
    .split(":")
    .map(Number);

  const start =
    ih*60 + im;

  const end =
    oh*60 + om;

  const minutes =
    end-start;


  /* late IN */

  if(ih >= 12)
    return "Half Day";


  /* early OUT */

  if(oh < 14)
    return "Half Day";


  /* 8 hours */

  if(minutes >= 480)
    return "Full Day";


  return "Half Day";
}


/* ================================
   MARK ATTENDANCE
================================ */

async function mark(type){

  try{

    toast("GPS check ho raha hai...");

    const current =
      await todayAttendance();


    if(
      type === "IN" &&
      current.inRow
    ){

      toast(
        "Aaj ka IN already marked hai"
      );

      return;
    }


    if(
      type === "OUT" &&
      !current.inRow
    ){

      toast(
        "Pehle IN mark kijiye"
      );

      return;
    }


    if(
      type === "OUT" &&
      current.outRow
    ){

      toast(
        "Aaj ka OUT already marked hai"
      );

      return;
    }


    const gps =
      await locate();


    if(gps.dist > gps.radius){

      toast(
        `Office se ${gps.dist}m door hain. ` +
        `Allowed ${gps.radius}m hai.`
      );

      return;
    }


    const now =
      new Date()
      .toTimeString()
      .slice(0,8);


    const payload = {

      employee_id:
        session.id,

      employee_name:
        session.name,

      attendance_date:
        today(),

      attendance_type:
        type,

      in_time:
        type === "IN"
          ? now
          : null,

      out_time:
        type === "OUT"
          ? now
          : null,

      latitude:
        gps.lat,

      longitude:
        gps.lon,

      distance_meters:
        gps.dist

    };


    const {error} =
      await db
        .from("attendance")
        .insert(payload);


    if(error)
      throw error;


    toast(
      `${type} successful • ${gps.dist}m`
    );

    employeePage();

  }

  catch(error){

    toast(
      error.message ||
      "Attendance failed"
    );

  }
}

/* ================================
   MONTH ATTENDANCE
================================ */

async function monthRows(
  employeeId,
  year,
  month
){

  const start =
    new Date(year,month,1)
    .toISOString()
    .slice(0,10);

  const end =
    new Date(year,month+1,0)
    .toISOString()
    .slice(0,10);


  const {data} =
    await db
      .from("attendance")
      .select("*")
      .eq("employee_id",employeeId)
      .gte("attendance_date",start)
      .lte("attendance_date",end);


  const map = {};


  (data || []).forEach(row=>{

    map[row.attendance_date] ??= {};

    if(
      row.attendance_type === "IN"
    ){

      map[row.attendance_date].i =
        row.in_time;

    }

    if(
      row.attendance_type === "OUT"
    ){

      map[row.attendance_date].o =
        row.out_time;

    }

  });


  return Object.entries(map)
    .map(([date,value])=>({

      d:date,

      ...value,

      st:status(
        value.i,
        value.o
      )

    }));

}


/* ================================
   CALENDAR
================================ */

async function loadCal(){

  const year =
    employeeCalendarDate.getFullYear();

  const month =
    employeeCalendarDate.getMonth();


  const rows =
    await monthRows(
      session.id,
      year,
      month
    );


  const map =
    Object.fromEntries(
      rows.map(x=>[x.d,x])
    );


  const monthStart =
    `${year}-${String(month+1)
      .padStart(2,"0")}-01`;

  const monthEnd =
    new Date(year,month+1,0)
      .toISOString()
      .slice(0,10);


  const {data:holidays} =
    await db
      .from("holidays")
      .select("*")
      .gte("holiday_date",monthStart)
      .lte("holiday_date",monthEnd);


  const holidayMap =
    Object.fromEntries(
      (holidays || [])
      .map(x=>[
        x.holiday_date,
        x.holiday_name ||
        x.name ||
        "Holiday"
      ])
    );


  const {data:leaves} =
    await db
      .from("leave_requests")
      .select("*")
      .eq("employee_id",session.id)
      .eq("status","APPROVED")
      .gte("leave_date",monthStart)
      .lte("leave_date",monthEnd);


  const leaveMap =
    Object.fromEntries(
      (leaves || [])
      .map(x=>[
        x.leave_date,
        x.reason
      ])
    );


  const first =
    new Date(year,month,1)
    .getDay();

  const days =
    new Date(year,month+1,0)
    .getDate();


  let html = `
    <div class="calendar">

      ${[
        "Sun",
        "Mon",
        "Tue",
        "Wed",
        "Thu",
        "Fri",
        "Sat"
      ]
      .map(x=>`
        <div class="dow">
          ${x}
        </div>
      `)
      .join("")}
  `;


  for(let i=0;i<first;i++){

    html += `<div></div>`;

  }


  for(
    let day=1;
    day<=days;
    day++
  ){

    const date =
      `${year}-${String(month+1)
        .padStart(2,"0")}-${String(day)
        .padStart(2,"0")}`;


    const row =
      map[date];


    const holiday =
      holidayMap[date];


    const leave =
      leaveMap[date];


    let classes =
      "day";


    if(date === today())
      classes += " today";


    if(holiday)
      classes += " holiday";


    if(leave)
      classes += " leave";


    if(
      new Date(date).getDay() === 0
    )
      classes += " sun";


    let info = "";


    if(holiday){

      info =
        `🟠 ${esc(holiday)}`;

    }

    else if(leave){

      info =
        `🟣 Leave`;

    }

    else if(row){

      let cls =
        row.st === "Full Day"
          ? "full"
          : row.st === "Half Day"
            ? "half"
            : "incomplete";


      info =
        `<span class="badge ${cls}">
          ${esc(row.st)}
        </span>`;

    }


    html += `

      <div class="${classes}">

        <small>
          ${day}
        </small>

        <span class="mini">
          ${info}
        </span>

        ${
          row
            ? `
              <span class="mini">
                ${fmtTime(row.i)}
                -
                ${fmtTime(row.o)}
              </span>
            `
            : ""
        }

      </div>

    `;

  }


  html += `</div>`;


  $("calendar").innerHTML =
    html;


  renderMonthMenu();
}

          <button

      employeeCalendarDate.getFullYear()+n
    );

  renderMonthMenu();

  employeePage();

  employeeCalendarDate

      1
    );

  employeePage();
}

async function applyLeave(){

  const date =
    $("leaveDate").value;

  const reason =
    $("leaveReason")
      .value
      .trim();


  if(!date || !reason){

    toast(
      "Date aur reason bhariye"
    );

    return;
  }


  const {error} =
    await db
      .from("leave_requests")
      .insert({

        employee_id:
          session.id,

        employee_name:
          session.name,

        leave_date:
          date,

        reason:
          reason,

        status:
          "PENDING"

  if(error){

    return;

  toast(
    "Leave request submit ho gaya"
  );


  $("leaveDate").value = "";
  $("leaveReason").value = "";


  loadMyLeaves();

/* ================================

================================ */

async function saveEmployee(){

  const obj = {

    employee_id:
      $("e_id").value.trim(),

    name:
      $("e_name").value.trim(),

    password:
      $("e_pass").value,

    post:
      $("e_post").value.trim(),

    salary:
      Number(
        $("e_salary").value || 0
      )

  };


  if(
    !obj.employee_id ||
    !obj.name ||
    !obj.password
  ){

    toast(
      "ID, Name aur Password required"
    );

    return;
  }


  let result;


  if(editingId){

    result =
      await db
        .from("employees")
        .update(obj)
        .eq(
          "employee_id",
          editingId
        );

  }

  else{

    result =
      await db
        .from("employees")
        .insert(obj);

  }


  if(result.error){

    toast(
      result.error.message
    );

    return;
  }


  toast(
    "Employee saved successfully"
  );


  closeModal();

  adminEmployees();
}

            ${
              error
              ?
              `
                <tr>
                  <td colspan="5">
                    ${esc(error.message)}
                  </td>
                </tr>
              `
              :
              rows.length
              ?
              rows.map(x=>{

                const st =
                  status(x.i,x.o);

                const cls =
                  st === "Full Day"
                    ? "full"
                    : st === "Half Day"
                      ? "half"
                      : "incomplete";


                return `

                <tr>

                  <td>
                    ${fmtDate(x.date)}
                  </td>

                  <td>

                    ${esc(x.name)}

                    <br>

                    <span
                      class="muted"
                    >
                      ${esc(x.id)}
                    </span>

                  </td>

                  <td>
                    ${fmtTime(x.i)}
                  </td>

                  <td>
                    ${fmtTime(x.o)}
                  </td>

                  <td>

                    <span
                      class="badge ${cls}"
                    >
                      ${esc(st)}
                    </span>

                  </td>

                </tr>

                `;

              }).join("")
              :
              `
                <tr>
                  <td
                    colspan="5"
                    style="text-align:center"
                  >
                    No attendance
                  </td>
                </tr>
              `
            }

          </tbody>

        </table>

      </div>

    </div>

  `;
}


/* ================================
   CSV
================================ */

function exportCSV(rows){

  let csv =
    "Date,Employee ID,Employee Name,IN,OUT,Status\n";


  rows.forEach(x=>{

    csv += [

      x.date,
      x.id,
      x.name,
      x.i || "",
      x.o || "",
      status(x.i,x.o)

    ]
    .map(
      value =>
        `"${String(value)
          .replace(/"/g,'""')}"`
    )
    .join(",")
    + "\n";

  });


  const blob =
    new Blob(
      [csv],
      {type:"text/csv"}
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "payol-attendance.csv";

  a.click();


  URL.revokeObjectURL(url);
}

async function addHoliday(){

  const date =
    $("h_date").value;

  const name =
    $("h_name")
      .value
      .trim();


  if(!date || !name){

    toast(
      "Date aur holiday name bhariye"
    );

    return;
  }


  const {error} =
    await db
      .from("holidays")
      .insert({

        holiday_date:
          date,

        name:
          name,

        holiday_name:
          name

      });


  if(error){

    toast(error.message);

    return;
  }


  toast(
    "Holiday added"
  );


  adminHolidays();
}


async function deleteHoliday(id){

  const {error} =
    await db
      .from("holidays")
      .delete()
      .eq("id",id);


  if(error){

    toast(error.message);

    return;
  }


  toast(
    "Holiday deleted"
  );


  adminHolidays();
}

/* ================================
   USE OFFICE GPS
================================ */

async function useCurrentOfficeGPS(){

  try{

    const gps =
      await getGPS();


    $("o_lat").value =
      gps.lat;

    $("o_lon").value =
      gps.lon;


    toast(
      `GPS received • accuracy ${gps.accuracy}m`
    );

  }

  catch(error){

    toast(
      error.message
    );

  }
}


/* ================================
   SAVE OFFICE
================================ */

async function saveOffice(){

  const lat =
    Number(
      $("o_lat").value
    );

  const lon =
    Number(
      $("o_lon").value
    );

  const radius =
    Number(
      $("o_radius").value || 100
    );


  if(
    !lat ||
    !lon ||
    radius < 1
  ){

    toast(
      "Valid GPS aur radius bhariye"
    );

    return;
  }


  const {error} =
    await db
      .from("office_settings")
      .upsert({

        id:1,

        latitude:lat,

        longitude:lon,

        radius_meters:radius

      });


  if(error){

    toast(error.message);

    return;
  }


  toast(
    "Office GPS saved successfully"
  );

}
