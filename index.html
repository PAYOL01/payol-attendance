<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Payol Attendance</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f2f4f7;margin:0;padding:20px}
.box{max-width:500px;margin:30px auto;background:white;padding:25px;border-radius:12px;box-shadow:0 3px 15px #ccc}
h1,h2{text-align:center}
input,select,button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border-radius:7px;border:1px solid #ccc;font-size:15px}
button{background:#1769aa;color:white;border:0;cursor:pointer}
.green{background:#168a45}.red{background:#c62828}.gray{background:#555}
.hidden{display:none}.message{text-align:center;margin:12px 0;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px}
th,td{border:1px solid #ddd;padding:7px;text-align:center}
th{background:#eee}
</style>
</head>

<body>

<div class="box" id="loginBox">
<h1>Payol Attendance</h1>
<input id="loginId" placeholder="Employee ID / Admin Username">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<div class="message" id="loginMessage"></div>
</div>

<div class="box hidden" id="employeePanel">
<h2>Employee Attendance</h2>
<p>Welcome, <b id="employeeName"></b></p>
<button class="green" onclick="markAttendance('IN')">Mark IN</button>
<button class="red" onclick="markAttendance('OUT')">Mark OUT</button>
<div class="message" id="attendanceMessage"></div>
<button class="gray" onclick="logout()">Logout</button>
</div>

<div class="box hidden" id="adminPanel">
<h2>Admin Panel</h2>

<button onclick="saveOfficeLocation()">Save Current Office Location</button>
<div class="message" id="officeMessage"></div>

<hr>

<h3>Add Employee</h3>
<input id="newEmployeeId" placeholder="Employee ID">
<input id="newEmployeeName" placeholder="Employee Name">
<input id="newEmployeePassword" placeholder="Password">
<button onclick="addEmployee()">Add Employee</button>
<div class="message" id="employeeMessage"></div>

<hr>

<hr>

<h3>Employee Management</h3>

<button onclick="loadEmployeeList()">Refresh Employee List</button>

<div id="employeeList"></div>
<input id="reportDate" type="date">

<select id="reportEmployee">
<option value="">All Employees</option>
</select>

<button onclick="loadReport()">Show Report</button>
<div id="report"></div>

<button class="gray" onclick="logout()">Logout</button>
</div>

<script>

const SUPABASE_URL =
"https://nkbbcygtuaejcuquwhpi.supabase.co";

/* APNI PURANI PUBLISHABLE KEY YAHAN RAKHO */
const SUPABASE_KEY =
"sb_publishable_wac3Xs5ba2V6slW990JvHQ_-4bsLKtS";

const supabaseClient =
supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentEmployee=null;


/* LOGIN */

async function login(){

const loginId=document.getElementById("loginId").value.trim();
const password=document.getElementById("loginPassword").value.trim();
const message=document.getElementById("loginMessage");

message.innerText="";

if(!loginId || !password){
message.innerText="ID aur Password dono bhariye.";
return;
}

/* ADMIN */

if(loginId==="Baijnathpayol" && password==="123456789"){

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("adminPanel").classList.remove("hidden");

document.getElementById("reportDate").value=
new Date().toISOString().split("T")[0];

loadEmployeesForReport();
return;
}

/* EMPLOYEE */

const {data,error}=await supabaseClient
.from("employees")
.select("*")
.eq("employee_id",loginId)
.eq("password",password)
.maybeSingle();

if(error){
message.innerText="Login error: "+error.message;
return;
}

if(!data){
message.innerText="Employee ID ya Password galat hai.";
return;
}

currentEmployee=data;

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("employeePanel").classList.remove("hidden");
document.getElementById("employeeName").innerText=data.name;

}


/* LOGOUT */

function logout(){

currentEmployee=null;

document.getElementById("loginBox").classList.remove("hidden");
document.getElementById("employeePanel").classList.add("hidden");
document.getElementById("adminPanel").classList.add("hidden");

document.getElementById("loginId").value="";
document.getElementById("loginPassword").value="";
}


/* DISTANCE */

function calculateDistance(lat1,lon1,lat2,lon2){

const R=6371000;

const dLat=(lat2-lat1)*Math.PI/180;
const dLon=(lon2-lon1)*Math.PI/180;

const a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2);

const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

return R*c;
}


/* ATTENDANCE */

async function markAttendance(type){

const message=document.getElementById("attendanceMessage");

message.innerText="Location check ho raha hai...";

if(!navigator.geolocation){
message.innerText="GPS available nahi hai.";
return;
}

navigator.geolocation.getCurrentPosition(async function(position){

try{

const latitude=position.coords.latitude;
const longitude=position.coords.longitude;

const {data:office,error:officeError}=await supabaseClient
.from("office_settings")
.select("*")
.eq("id",1)
.single();

if(officeError || !office){
message.innerText="Office location nahi mili.";
return;
}

if(office.latitude===null || office.longitude===null){
message.innerText="Office location save nahi hai.";
return;
}

const distance=calculateDistance(
latitude,
longitude,
office.latitude,
office.longitude
);

const radius=office.radius_meters || 100;

if(distance>radius){

message.innerText=
"Aap office se "+Math.round(distance)+
" meter door hain. 100 meter ke andar hona zaroori hai.";

return;
}

const today=new Date().toISOString().split("T")[0];

const {error}=await supabaseClient
.from("attendance")
.insert([{
employee_id:currentEmployee.employee_id,
employee_name:currentEmployee.name,
attendance_type:type,
latitude:latitude,
longitude:longitude,
distance_meters:distance,
attendance_date:today
}]);

if(error){

message.innerText=
"Attendance save nahi hui: "+error.message;

return;
}

message.innerText=
type+" Attendance Successfully Marked. Distance: "+
Math.round(distance)+" meter";

}catch(err){

console.error(err);
message.innerText="Kuch error hua.";

}

},function(error){

if(error.code===1){
message.innerText="Location permission Allow karo.";
}else{
message.innerText="Location nahi mil pa rahi hai.";
}

},{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
});

}


/* OFFICE LOCATION */

function saveOfficeLocation(){

const message=document.getElementById("officeMessage");

message.innerText="Current location li ja rahi hai...";

navigator.geolocation.getCurrentPosition(async function(position){

const latitude=position.coords.latitude;
const longitude=position.coords.longitude;

const {error}=await supabaseClient
.from("office_settings")
.update({
latitude:latitude,
longitude:longitude,
radius_meters:100
})
.eq("id",1);

if(error){

message.innerText=
"Location save nahi hui: "+error.message;

return;
}

message.innerText=
"Office location successfully save ho gayi. Radius: 100 meter";

},function(){

message.innerText="Location permission Allow karo.";

},{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
});

}


/* ADD EMPLOYEE */

async function addEmployee(){

const id=document.getElementById("newEmployeeId").value.trim();
const name=document.getElementById("newEmployeeName").value.trim();
const password=document.getElementById("newEmployeePassword").value.trim();
const message=document.getElementById("employeeMessage");

if(!id || !name || !password){

message.innerText="Sabhi details bhariye.";
return;
}

const {error}=await supabaseClient
.from("employees")
.insert([{
employee_id:id,
name:name,
password:password
}]);

if(error){

message.innerText=
"Employee add nahi hua: "+error.message;

return;
}

message.innerText="Employee successfully add ho gaya.";

document.getElementById("newEmployeeId").value="";
document.getElementById("newEmployeeName").value="";
document.getElementById("newEmployeePassword").value="";

loadEmployeesForReport();

}


/* EMPLOYEE LIST */

async function loadEmployeesForReport(){

const select=document.getElementById("reportEmployee");

const {data,error}=await supabaseClient
.from("employees")
.select("employee_id,name")
.order("employee_id");

if(error)return;

select.innerHTML='<option value="">All Employees</option>';

data.forEach(function(employee){

const option=document.createElement("option");

option.value=employee.employee_id;
option.textContent=
employee.employee_id+" - "+employee.name;

select.appendChild(option);

});

}

/* EMPLOYEE MANAGEMENT */

async function loadEmployeeList() {

  const list =
    document.getElementById("employeeList");

  list.innerHTML = "Loading...";

  const { data, error } =
    await supabaseClient
      .from("employees")
      .select("id,employee_id,name")
      .order("employee_id");

  if (error) {

    list.innerHTML =
      "Employee list load nahi hui: " +
      error.message;

    return;
  }

  if (!data || data.length === 0) {

    list.innerHTML =
      "<p>No employees found.</p>";

    return;
  }

  let html = "<table>";

  html +=
    "<tr>" +
    "<th>ID</th>" +
    "<th>Name</th>" +
    "<th>Action</th>" +
    "</tr>";

  data.forEach(function(employee) {

    html +=
      "<tr>" +
      "<td>" + employee.employee_id + "</td>" +
      "<td>" + employee.name + "</td>" +
      "<td>" +
      "<button class='red' onclick=\"deleteEmployee('" +
      employee.id +
      "','" +
      employee.employee_id +
      "')\">Delete</button>" +
      "</td>" +
      "</tr>";

  });

  html += "</table>";

  list.innerHTML = html;
}


async function deleteEmployee(id, employeeId) {

  const confirmDelete =
    confirm(
      "Kya aap " +
      employeeId +
      " ko delete karna chahte hain?"
    );

  if (!confirmDelete) {
    return;
  }

  const { error } =
    await supabaseClient
      .from("employees")
      .delete()
      .eq("id", id);

  if (error) {

    alert(
      "Employee delete nahi hua: " +
      error.message
    );

    return;
  }

  alert("Employee delete ho gaya.");

  loadEmployeeList();
  loadEmployeesForReport();
}
/* REPORT */

async function loadReport(){

const report=document.getElementById("report");

const date=document.getElementById("reportDate").value;
const employee=document.getElementById("reportEmployee").value;

report.innerHTML="Loading...";

let query=supabaseClient
.from("attendance")
.select("*")
.eq("attendance_date",date)
.order("created_at",{ascending:false});

if(employee){
query=query.eq("employee_id",employee);
}

const {data,error}=await query;

if(error){

report.innerHTML=
"Report load nahi hui: "+error.message;

return;
}

if(!data || data.length===0){

report.innerHTML="<p>No attendance found.</p>";
return;
}

let html=
"<table>"+
"<tr>"+
"<th>Employee</th>"+
"<th>Type</th>"+
"<th>Time</th>"+
"<th>Distance</th>"+
"</tr>";

data.forEach(function(row){

const time=new Date(row.created_at)
.toLocaleTimeString();

html+=
"<tr>"+
"<td>"+row.employee_id+"<br>"+row.employee_name+"</td>"+
"<td>"+row.attendance_type+"</td>"+
"<td>"+time+"</td>"+
"<td>"+Math.round(row.distance_meters)+" m</td>"+
"</tr>";

});

html+="</table>";

report.innerHTML=html;

}

</script>

</body>
</html>
