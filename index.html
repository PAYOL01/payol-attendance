body{

button,input,select,textarea{

button{

.login-btn{

/* APP */

.app{

}

.topbar{

.brand-logo{

.user-info{

.user-name{

.user-role{

.logout{

.layout{

.sidebar{

.sidebar button{

.sidebar button:hover{

.content{

.page-title{

}

.page-sub{

  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{

  border-radius:16px;
  padding:18px;

}

.stat{

}

.stat-title{

}

.stat-value{

.card h3{

.btn{

}

.primary{

}

.dark{

  color:#fff;
}

.green{
  background:var(--green);
  color:#fff;
}

.orange{

  color:#111;
}

.danger{

}

.gray{

/* FORMS */

.form-grid{

.form-full{

/* ATTENDANCE */

.attendance-buttons{

.attendance-btn{

.absent{

<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL="https://nkbbcygtuaejcuquwhpi.supabase.co";

const SUPABASE_KEY="sb_publishable_wac3Xs5ba2V6slW990JvHQ_-4bsLKtS";

const db=supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==============================
   ADMIN
============================== */

const ADMIN_USER="Baijnathpayol";
const ADMIN_PASS="123456789";


/* ==============================
   GLOBAL
============================== */

let currentUser=null;
let currentEmployee=null;
let office={
  latitude:null,
  longitude:null,
  radius_meters:100
};

let employees=[];
let attendance=[];
let holidays=[];
let leaves=[];

/* ==============================
   HELPERS
============================== */

const $=id=>document.getElementById(id);

function esc(v){
  if(v===null || v===undefined) return "";
  return String(v)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function todayDate(){
  return new Date().toISOString().slice(0,10);
}

function currentTime(){
  return new Date().toTimeString().slice(0,8);
}

function formatTime(t){
  if(!t) return "--";

  return t.slice(0,5);
}

function money(v){
  return "₹"+Number(v||0).toLocaleString("en-IN");
}


/* ==============================
   LOGIN
============================== */

async function login(){

  const type=$("loginType").value;
  const username=$("loginUser").value.trim();
  const password=$("loginPass").value;

  $("loginMsg").textContent="";

  if(!username || !password){
    $("loginMsg").textContent="Username aur password dalein.";
    return;
  }


  /* ADMIN */

  if(type==="admin"){

    if(username===ADMIN_USER && password===ADMIN_PASS){

      currentUser={
        role:"admin",
        username:username
      };

      localStorage.setItem(
        "payol",
        JSON.stringify(currentUser)
      );

      showApp();

    }else{

      $("loginMsg").textContent=
        "Admin username ya password galat hai.";
    }

    return;
  }


  /* EMPLOYEE */

  try{

    const {data,error}=await db
      .from("employees")
      .select("*")
      .eq("id",username)
      .maybeSingle();

    if(error) throw error;

    if(!data){
      $("loginMsg").textContent="Employee ID nahi mila.";
      return;
    }

    if(String(data.password)!==String(password)){
      $("loginMsg").textContent="Password galat hai.";
      return;
    }

    currentEmployee=data;

    currentUser={
      role:"employee",
      employee_id:data.id,
      name:data.name
    };

    localStorage.setItem(
      "payol",
      JSON.stringify(currentUser)
    );

    showApp();

  }catch(e){

    console.error(e);

    $("loginMsg").textContent=
      "Login error: "+(e.message||"Unknown error");
  }
}


/* ==============================
   AUTO LOGIN
============================== */

async function autoLogin(){

  const saved=localStorage.getItem("payol");

  if(!saved) return;

  try{

    currentUser=JSON.parse(saved);

    if(currentUser.role==="employee"){

      const {data}=await db
        .from("employees")
        .select("*")
        .eq("id",currentUser.employee_id)
        .maybeSingle();

      if(!data){
        logout();
        return;
      }

      currentEmployee=data;
    }

    showApp();

  }catch(e){

    localStorage.removeItem("payol");
  }
}


/* ==============================
   SHOW APP
============================== */

function showApp(){

  $("loginPage").classList.add("hidden");
  $("app").classList.remove("hidden");

  $("headerName").textContent=
    currentUser.role==="admin"
      ? "Baijnathpayol"
      : (currentEmployee?.name||"Employee");

  $("headerRole").textContent=
    currentUser.role==="admin"
      ? "Administrator"

   LOGOUT

============================== */

async function loadOffice(){

  const {data,error}=await db
    .from("office_settings")
    .select("*")
    .eq("id",1)
    .maybeSingle();

  if(!error && data){

    office=data;

    if(!office.radius_meters)
      office.radius_meters=100;
  }

  return office;
}


/* ==============================
   DISTANCE
============================== */

function getDistance(lat1,lon1,lat2,lon2){

  const R=6371000;

  const p1=lat1*Math.PI/180;
  const p2=lat2*Math.PI/180;

  const dp=(lat2-lat1)*Math.PI/180;
  const dl=(lon2-lon1)*Math.PI/180;

  const a=
    Math.sin(dp/2)**2+
    Math.cos(p1)*
    Math.cos(p2)*
    Math.sin(dl/2)**2;

  const c=2*Math.atan2(
    Math.sqrt(a),
    Math.sqrt(1-a)
  );

  return R*c;
}

/* ==============================
   ATTENDANCE STATUS
============================== */

function attendanceStatus(i,o){

  if(!i && !o)
    return "Absent";

  if(i && !o)
    return "Incomplete";

  if(!i && o)
    return "Incomplete";

  const inMinutes=timeToMinutes(i);
  const outMinutes=timeToMinutes(o);

  if(inMinutes>=720)
    return "Half Day";

  if(outMinutes<840)
    return "Half Day";

  const duration=outMinutes-inMinutes;

  if(duration>=480)
    return "Full Day";

  return "Half Day";
}


function timeToMinutes(t){

  if(!t) return 0;

  const p=t.split(":");

  return Number(p[0])*60+Number(p[1]);
}


function statusBadge(status){

  if(status==="Full Day")
    return `<span class="badge present">FULL DAY</span>`;

  if(status==="Half Day")
    return `<span class="badge half">HALF DAY</span>`;

  if(status==="Incomplete")
    return `<span class="badge pending">INCOMPLETE</span>`;

  return `<span class="badge absent">ABSENT</span>`;
}


/* ==============================
   MARK IN / OUT
============================== */

async function markAttendance(type){

  if(!currentEmployee){
    alert("Employee login nahi hai.");
    return;
  }

  const btn=
    type==="IN"
      ? $("inButton")
      : $("outButton");

  if(btn) btn.disabled=true;

  try{

    await loadOffice();

    if(
      office.latitude===null ||
      office.longitude===null
    ){
      alert(
        "Office GPS set nahi hai. Admin pehle Office GPS set kare."
      );

      if(btn) btn.disabled=false;
      return;
    }


    const today=todayDate();


    /* ALWAYS CHECK DATABASE FIRST */

    const {data:existing,error:checkError}=await db
      .from("attendance")
      .select("*")
      .eq("employee_id",currentEmployee.id)
      .eq("attendance_date",today)
      .maybeSingle();

    if(checkError) throw checkError;


    /* IN DUPLICATE BLOCK */

    if(type==="IN" && existing?.in_time){

      alert(
        "Aaj Mark IN already ho chuka hai.\n" +
        "Ek din me sirf 1 baar IN allowed hai."
      );

      employeePage();
      return;
    }


    /* OUT BEFORE IN BLOCK */

    if(type==="OUT" && !existing?.in_time){

      alert("Pehle Mark IN karein.");

      employeePage();
      return;
    }


    /* OUT DUPLICATE BLOCK */

    if(type==="OUT" && existing?.out_time){

      alert(
        "Aaj Mark OUT already ho chuka hai.\n" +
        "Ek din me sirf 1 baar OUT allowed hai."
      );

      employeePage();
      return;
    }


    /* GPS */

    if(!navigator.geolocation){

      alert("Is device me GPS available nahi hai.");

      if(btn) btn.disabled=false;
      return;
    }


    navigator.geolocation.getCurrentPosition(

      async position=>{

        try{

          const lat=position.coords.latitude;
          const lng=position.coords.longitude;

          const distance=getDistance(
            lat,
            lng,
            Number(office.latitude),
            Number(office.longitude)
          );


          /* RADIUS CHECK */

          if(
            distance >
            Number(office.radius_meters||100)
          ){

            alert(
              "❌ Attendance allowed nahi hai.\n\n"+
              "Office se distance: "+
              Math.round(distance)+
              " meter\n"+
              "Allowed: "+
              Number(office.radius_meters||100)+
              " meter"
            );

            if(btn) btn.disabled=false;
            return;
          }


          const time=currentTime();


          /* SECOND DATABASE CHECK
             protects against double click/network race */

          const {data:latest}=await db
            .from("attendance")
            .select("*")
            .eq("employee_id",currentEmployee.id)
            .eq("attendance_date",today)
            .maybeSingle();


          if(type==="IN"){

            if(latest?.in_time){

              alert("Aaj ka IN already marked hai.");
              employeePage();
              return;
            }


            if(latest){

              const {error}=await db
                .from("attendance")
                .update({
                  in_time:time,
                  latitude:lat,
                  longitude:lng,
                  attendance_type:"IN"
                })
                .eq("id",latest.id);

              if(error) throw error;

            }else{

              const {error}=await db
                .from("attendance")
                .insert({
                  employee_id:currentEmployee.id,
                  employee_name:currentEmployee.name,
                  attendance_date:today,
                  in_time:time,
                  latitude:lat,
                  longitude:lng,
                  attendance_type:"IN"
                });

              if(error){

                if(
                  String(error.message)
                    .toLowerCase()
                    .includes("duplicate")
                ){

                  alert("Aaj ka IN already marked hai.");

                  employeePage();
                  return;
                }

                throw error;
              }
            }


            alert(
              "✅ Mark IN Successful\n\n"+
              "Time: "+formatTime(time)+"\n"+
              "Distance: "+Math.round(distance)+" meter"
            );


          }else{


            if(!latest?.in_time){

              alert("Pehle Mark IN karein.");
              employeePage();
              return;
            }

            if(latest?.out_time){

              alert("Aaj ka OUT already marked hai.");
              employeePage();
              return;
            }


            const {data:updated,error}=await db
              .from("attendance")
              .update({
                out_time:time,
                latitude:lat,
                longitude:lng,
                attendance_type:"OUT"
              })
              .eq("id",latest.id)
              .is("out_time",null)
              .select();

            if(error) throw error;

            if(!updated || updated.length===0){

              alert("Aaj ka OUT already marked hai.");
              employeePage();
              return;
            }


            alert(
              "✅ Mark OUT Successful\n\n"+
              "Time: "+formatTime(time)+"\n"+
              "Distance: "+Math.round(distance)+" meter"
            );

          }


          employeePage();

        }catch(e){

          console.error(e);

          alert(
            "Attendance save nahi ho saka.\n"+
            (e.message||"Unknown error")
          );

          employeePage();
        }

      },

      error=>{

        console.error(error);

        let msg="GPS location nahi mil rahi.";

        if(error.code===1)
          msg="GPS permission allow karein.";

        if(error.code===2)
          msg="GPS location unavailable hai.";

        if(error.code===3)
          msg="GPS timeout ho gaya.";

        alert(msg);

        if(btn) btn.disabled=false;
      },

      {
        enableHighAccuracy:true,
        timeout:20000,
        maximumAge:0
      }
    );

  }catch(e){

    console.error(e);

    alert(
      "Attendance check error:\n"+
      (e.message||"Unknown error")
    );

    if(btn) btn.disabled=false;
  }
}

async function renderEmployeeCalendar(){

  const year=
    employeeCalendarDate.getFullYear();

  const month=
    employeeCalendarDate.getMonth();

  const start=
    `${year}-${String(month+1).padStart(2,"0")}-01`;

  const lastDay=
    new Date(year,month+1,0).getDate();

  const end=
    `${year}-${String(month+1).padStart(2,"0")}-${lastDay}`;

  const {data:records}=await db
    .from("attendance")
    .select("*")
    .eq("employee_id",currentEmployee.id)
    .gte("attendance_date",start)
    .lte("attendance_date",end)
    .order("attendance_date");

  const {data:hol}=await db
    .from("holidays")
    .select("*")
    .gte("holiday_date",start)
    .lte("holiday_date",end);

  const map={};

  (records||[]).forEach(r=>{
    map[r.attendance_date]=r;
  });

  const holidayMap={};

  (hol||[]).forEach(h=>{
    holidayMap[h.holiday_date]=
      h.holiday_name||
      h.name||
      "Holiday";
  });


  let html=`

    <div class="calendar">

      <div class="cal-head">Sun</div>
      <div class="cal-head">Mon</div>
      <div class="cal-head">Tue</div>
      <div class="cal-head">Wed</div>
      <div class="cal-head">Thu</div>
      <div class="cal-head">Fri</div>
      <div class="cal-head">Sat</div>

  `;


  const first=
    new Date(year,month,1).getDay();


  for(let i=0;i<first;i++){

    html+=`<div></div>`;
  }


  for(let day=1;day<=lastDay;day++){

    const date=
      `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

    const rec=map[date];

    const status=attendanceStatus(
      rec?.in_time,
      rec?.out_time
    );

    let cls="";

    if(status==="Full Day")
      cls="present-day";

    if(status==="Half Day")
      cls="half-day";

    if(status==="Absent")
      cls="absent-day";

    if(holidayMap[date])
      cls="holiday-day";


    if(date===todayDate())
      cls+=" today";


    html+=`

      <div class="day ${cls}">

        <div class="day-number">${day}</div>

        ${
          holidayMap[date]
          ? `<div style="font-size:10px;margin-top:4px">
               🎉 ${esc(holidayMap[date])}
             </div>`
          : `
            <div style="font-size:10px;margin-top:4px">
              ${rec?.in_time
                ? "IN "+formatTime(rec.in_time)
                : ""}
            </div>

            <div style="font-size:10px">
              ${rec?.out_time
                ? "OUT "+formatTime(rec.out_time)
                : ""}
            </div>
          `
        }

      </div>
    `;
  }


  html+=`</div>`;


  $("employeeCalendarArea").innerHTML=html;
}


/* ==============================
   SALARY
============================== */

async function calculateMonthlySalary(emp,year,month){

  const start=
    `${year}-${String(month+1).padStart(2,"0")}-01`;

  const last=
    new Date(year,month+1,0).getDate();

  const end=
    `${year}-${String(month+1).padStart(2,"0")}-${last}`;


  const {data:records}=await db
    .from("attendance")
    .select("*")
    .eq("employee_id",emp.id)
    .gte("attendance_date",start)
    .lte("attendance_date",end);


  const {data:hol}=await db
    .from("holidays")
    .select("*")
    .gte("holiday_date",start)
    .lte("holiday_date",end);


  const holidaysSet=
    new Set(
      (hol||[]).map(x=>x.holiday_date)
    );


  const map={};

  (records||[]).forEach(r=>{
    map[r.attendance_date]=r;
  });


  let units=0;


  for(let d=1;d<=last;d++){

    const date=
      `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

    if(holidaysSet.has(date)){
      units+=1;
      continue;
    }

    const day=new Date(
      year,month,d
    ).getDay();


    /* Sunday paid holiday */

    if(day===0){
      units+=1;
      continue;
    }


    const status=attendanceStatus(
      map[date]?.in_time,
      map[date]?.out_time
    );


    if(status==="Full Day")
      units+=1;

    else if(status==="Half Day")
      units+=0.5;
  }


  const salary=Number(emp.salary||0);

  return Math.round(
    salary/last*units
  );
}

/* ==============================
   CSV
============================== */

function exportAttendanceCSV(){

  if(!attendance.length){

    alert("Attendance data nahi hai.");
    return;
  }


  const rows=[
    [
      "Date",
      "Employee ID",
      "Employee Name",
      "IN",
      "OUT",
      "Status",
      "Latitude",
      "Longitude"
    ]
  ];


  attendance.forEach(r=>{

    rows.push([
      r.attendance_date||"",
      r.employee_id||"",
      r.employee_name||"",
      r.in_time||"",
      r.out_time||"",
      attendanceStatus(
        r.in_time,
        r.out_time
      ),
      r.latitude||"",
      r.longitude||""
    ]);

  });


  const csv=rows
    .map(row=>
      row.map(v=>
        `"${String(v).replaceAll('"','""')}"`
      ).join(",")
    )
    .join("\n");


  const blob=new Blob(
    [csv],
    {type:"text/csv;charset=utf-8;"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download=
    "Payol_Attendance_"+todayDate()+".csv";

  a.click();

  URL.revokeObjectURL(url);
}

    .from("holidays")
    .insert({
      holiday_date:date,
      name:name,
      holiday_name:name
    });


  if(error){

    alert(

      error.message

  alert("✅ Holiday added.");

async function adminOffice(){

  buildSidebar();

  await loadOffice();


  $("content").innerHTML=`

    <div class="page-title">
      📍 Office GPS Settings
    </div>

    <div class="page-sub">
      Attendance ke liye office location aur radius set karein.
    </div>


    <div class="card">

      <div class="form-grid">

        <div class="form-group">
          <label>Latitude</label>
          <input
            id="officeLat"
            type="number"
            step="any"
            value="${office.latitude??""}">
        </div>

        <div class="form-group">
          <label>Longitude</label>
          <input
            id="officeLng"
            type="number"
            step="any"
            value="${office.longitude??""}">
        </div>

        <div class="form-group">
          <label>Allowed Radius (meters)</label>
          <input
            id="officeRadius"
            type="number"
            min="10"
            value="${office.radius_meters||100}">
        </div>

      </div>


      <br>

      <button
        class="btn dark"
        onclick="useCurrentGPS()">

        📍 Use Current GPS

      </button>

      <button
        class="btn primary"
        onclick="saveOffice()">

        Save Office Settings

      </button>


      <div
        style="margin-top:15px;padding:12px;
               background:#f3f4f6;
               border-radius:10px">

        <b>Current Setting:</b><br>

        Latitude:
        ${office.latitude??"Not set"}<br>

        Longitude:
        ${office.longitude??"Not set"}<br>

        Radius:
        ${office.radius_meters||100} meters

      </div>

    </div>

  `;
}


function useCurrentGPS(){

  if(!navigator.geolocation){

    alert("GPS available nahi hai.");
    return;
  }


  navigator.geolocation.getCurrentPosition(

    pos=>{

      $("officeLat").value=
        pos.coords.latitude;

      $("officeLng").value=
        pos.coords.longitude;

      alert("✅ Current GPS mil gaya.");

    },

    err=>{

      alert(
        "GPS permission allow karein."
      );

    },

    {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:0
    }

  );
}


async function saveOffice(){

  const latitude=
    Number($("officeLat").value);

  const longitude=
    Number($("officeLng").value);

  const radius=
    Number($("officeRadius").value||100);


  if(
    !Number.isFinite(latitude) ||
    !Number.isFinite(longitude)
  ){

    alert("Latitude aur Longitude sahi dalein.");
    return;
  }


  if(radius<10){

    alert("Radius minimum 10 meter rakhein.");
    return;
  }


  const {error}=await db
    .from("office_settings")
    .upsert({
      id:1,
      latitude,
      longitude,
      radius_meters:radius
    });


  if(error){

    alert(
      "Office settings save failed:\n"+
      error.message
    );

    return;
  }


  office={
    id:1,
    latitude,
    longitude,
    radius_meters:radius
  };


  alert("✅ Office GPS settings saved.");

  adminOffice();
}
