<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payol Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  margin:0;
  padding:20px;
}
.container{
  max-width:900px;
  margin:auto;
}
.card{
  background:white;
  padding:20px;
  margin-bottom:20px;
  border-radius:12px;
  box-shadow:0 2px 10px #ddd;
}
h1,h2,h3{
  color:#222;
}
input,select,button{
  width:100%;
  padding:12px;
  margin:7px 0;
  box-sizing:border-box;
  border-radius:7px;
  border:1px solid #ccc;
}
button{
  background:#1976d2;
  color:white;
  border:none;
  cursor:pointer;
  font-weight:bold;
}
button:hover{
  opacity:.9;
}
.green{
  background:#198754;
}
.red{
  background:#dc3545;
}
.hidden{
  display:none;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border:1px solid #ddd;
  padding:9px;
  text-align:left;
}
th{
  background:#eee;
}
.success{
  color:green;
  font-weight:bold;
}
.error{
  color:red;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="card" id="loginBox">
  <h1>Payol Attendance</h1>

  <input id="loginId" placeholder="Employee ID / Admin Username">
  <input id="loginPassword" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p id="loginMessage"></p>
</div>


<!-- EMPLOYEE PANEL -->

<div class="card hidden" id="employeePanel">

  <h2>Employee Attendance</h2>

  <p>
    Welcome, <b id="employeeName"></b>
  </p>

  <button class="green" onclick="markAttendance('IN')">
    Mark IN
  </button>

  <button class="red" onclick="markAttendance('OUT')">
    Mark OUT
  </button>

  <p id="attendanceMessage"></p>

  <button onclick="logout()">Logout</button>

</div>


<!-- ADMIN PANEL -->

<div class="card hidden" id="adminPanel">

  <h2>Admin Panel</h2>

  <h3>Office Location</h3>

  <button onclick="saveOfficeLocation()">
    Save Current Office Location
  </button>

  <p id="locationMessage"></p>

  <hr>

  <h3>Add Employee</h3>

  <input id="newEmployeeId" placeholder="Employee ID">
  <input id="newEmployeeName" placeholder="Employee Name">
  <input id="newEmployeePassword" placeholder="Password">

  <button onclick="addEmployee()">
    Add Employee
  </button>

  <p id="employeeMessage"></p>

  <hr>

  <h3>Employee Management</h3>

  <button onclick="loadEmployeeList()">
    Refresh Employee List
  </button>

  <div id="employeeList"></div>

  <hr>

  <h3>Attendance Report</h3>

  <input type="date" id="reportDate">

  <select id="reportEmployee">
    <option value="">All Employees</option>
  </select>

  <button onclick="loadReport()">
    Load Report
  </button>

  <div id="report"></div>

  <button onclick="logout()">Logout</button>

</div>

</div>


<script>

const SUPABASE_URL =
"https://nkbbcygtuaejcuquwhpi.supabase.co";

/*
  IMPORTANT:
  Yahan apni existing Supabase Publishable Key paste karo.
*/

const SUPABASE_KEY =
"sb_publishable_wac3Xs5ba2V6slW990JvHQ_-4bsLKtS";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let currentEmployee = null;


/* LOGIN */

async function login(){

  const loginId =
    document.getElementById("loginId").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");


  if(!loginId || !password){

    message.innerHTML =
      "<span class='error'>ID aur password bhariye.</span>";

    return;
  }


  /* ADMIN LOGIN */

  if(
    loginId === "Baijnathpayol" &&
    password === "123456789"
  ){

    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("adminPanel")
      .classList.remove("hidden");

    document.getElementById("reportDate").value =
      new Date().toISOString().split("T")[0];

    loadEmployeesForReport();
    loadEmployeeList();

    return;
  }


  /* EMPLOYEE LOGIN */

  const {data,error} =
    await supabaseClient
      .from("employees")
      .select("*")
      .eq("employee_id",loginId)
      .eq("password",password)
      .single();


  if(error || !data){

    message.innerHTML =
      "<span class='error'>Invalid ID ya password.</span>";

    return;
  }


  currentEmployee = data;

  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("employeePanel")
    .classList.remove("hidden");

  document.getElementById("employeeName")
    .innerText = data.name;

}


/* LOGOUT */

function logout(){

  currentEmployee = null;

  document.getElementById("loginBox")
    .classList.remove("hidden");

  document.getElementById("employeePanel")
    .classList.add("hidden");

  document.getElementById("adminPanel")
    .classList.add("hidden");

  document.getElementById("loginId").value="";
  document.getElementById("loginPassword").value="";

}


/* DISTANCE CALCULATION */

function calculateDistance(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const dLat =
    (lat2-lat1) * Math.PI/180;

  const dLon =
    (lon2-lon1) * Math.PI/180;

  const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2) *
    Math.sin(dLon/2);

  const c =
    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

  return R*c;
}


/* EMPLOYEE ATTENDANCE */

async function markAttendance(type){

  const message =
    document.getElementById("attendanceMessage");

  message.innerHTML =
    "Location check ho raha hai...";


  if(!navigator.geolocation){

    message.innerHTML =
      "<span class='error'>GPS supported nahi hai.</span>";

    return;
  }


  navigator.geolocation.getCurrentPosition(

    async function(position){

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;


      const {data:office,error:officeError} =
        await supabaseClient
          .from("office_settings")
          .select("*")
          .eq("id",1)
          .single();


      if(officeError || !office ||
         office.latitude === null ||
         office.longitude === null){

        message.innerHTML =
          "<span class='error'>Office location set nahi hai.</span>";

        return;
      }


      const distance =
        calculateDistance(
          latitude,
          longitude,
          office.latitude,
          office.longitude
        );


      const radius =
        office.radius_meters || 100;


      if(distance > radius){

        message.innerHTML =
          "<span class='error'>" +
          "Aap office se " +
          Math.round(distance) +
          " meter door hain. " +
          radius +
          " meter ke andar hona zaroori hai." +
          "</span>";

        return;
      }


      const today =
        new Date().toISOString().split("T")[0];


      const {error} =
        await supabaseClient
          .from("attendance")
          .insert({

            employee_id:
              currentEmployee.employee_id,

            employee_name:
              currentEmployee.name,

            attendance_type:
              type,

            latitude:
              latitude,

            longitude:
              longitude,

            distance_meters:
              distance,

            attendance_date:
              today
          });


      if(error){

        message.innerHTML =
          "<span class='error'>" +
          "Attendance save nahi hui: " +
          error.message +
          "</span>";

        return;
      }


      message.innerHTML =
        "<span class='success'>" +
        type +
        " Attendance successfully marked. " +
        "Distance: " +
        Math.round(distance) +
        " m" +
        "</span>";

    },

    function(error){

      message.innerHTML =
        "<span class='error'>" +
        "GPS permission/location check failed." +
        "</span>";

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }

  );

}


/* SAVE OFFICE LOCATION */

function saveOfficeLocation(){

  const message =
    document.getElementById("locationMessage");

  message.innerHTML =
    "Current location mil rahi hai...";


  if(!navigator.geolocation){

    message.innerHTML =
      "<span class='error'>GPS supported nahi hai.</span>";

    return;
  }


  navigator.geolocation.getCurrentPosition(

    async function(position){

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;


      const {error} =
        await supabaseClient
          .from("office_settings")
          .upsert({

            id:1,

            latitude:
              latitude,

            longitude:
              longitude,

            radius_meters:
              100

          });


      if(error){

        message.innerHTML =
          "<span class='error'>" +
          error.message +
          "</span>";

        return;
      }


      message.innerHTML =
        "<span class='success'>" +
        "Office location saved. Radius: 100 meter" +
        "</span>";

    },

    function(){

      message.innerHTML =
        "<span class='error'>" +
        "Location permission allow karo." +
        "</span>";

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }

  );

}


/* ADD EMPLOYEE */

async function addEmployee(){

  const id =
    document.getElementById("newEmployeeId")
      .value.trim();

  const name =
    document.getElementById("newEmployeeName")
      .value.trim();

  const password =
    document.getElementById("newEmployeePassword")
      .value;


  const message =
    document.getElementById("employeeMessage");


  if(!id || !name || !password){

    message.innerHTML =
      "<span class='error'>" +
      "Sabhi fields bhariye." +
      "</span>";

    return;
  }


  const {error} =
    await supabaseClient
      .from("employees")
      .insert({

        employee_id:id,
        name:name,
        password:password

      });


  if(error){

    message.innerHTML =
      "<span class='error'>" +
      "Employee add nahi hua: " +
      error.message +
      "</span>";

    return;
  }


  message.innerHTML =
    "<span class='success'>" +
    "Employee successfully add ho gaya." +
    "</span>";


  document.getElementById("newEmployeeId").value="";
  document.getElementById("newEmployeeName").value="";
  document.getElementById("newEmployeePassword").value="";


  loadEmployeeList();
  loadEmployeesForReport();

}


/* EMPLOYEE LIST */

async function loadEmployeeList(){

  const list =
    document.getElementById("employeeList");

  list.innerHTML =
    "Loading...";


  const {data,error} =
    await supabaseClient
      .from("employees")
      .select("id,employee_id,name")
      .order("employee_id");


  if(error){

    list.innerHTML =
      "<span class='error'>" +
      "Employee list load nahi hui: " +
      error.message +
      "</span>";

    return;
  }


  if(!data || data.length===0){

    list.innerHTML =
      "<p>No employees found.</p>";

    return;
  }


  let html =
    "<table>" +
    "<tr>" +
    "<th>ID</th>" +
    "<th>Name</th>" +
    "<th>Action</th>" +
    "</tr>";


  data.forEach(function(employee){

    html +=
      "<tr>" +

      "<td>" +
      employee.employee_id +
      "</td>" +

      "<td>" +
      employee.name +
      "</td>" +

      "<td>" +

      "<button class='red' " +
      "onclick=\"deleteEmployee('" +
      employee.id +
      "','" +
      employee.employee_id +
      "')\">" +

      "Delete" +

      "</button>" +

      "</td>" +

      "</tr>";

  });


  html +=
    "</table>";


  list.innerHTML =
    html;

}


/* DELETE EMPLOYEE */

async function deleteEmployee(
  id,
  employeeId
){

  const confirmDelete =
    confirm(
      "Kya aap " +
      employeeId +
      " ko delete karna chahte hain?"
    );


  if(!confirmDelete){
    return;
  }


  const {error} =
    await supabaseClient
      .from("employees")
      .delete()
      .eq("id",id);


  if(error){

    alert(
      "Employee delete nahi hua: " +
      error.message
    );

    return;
  }


  alert(
    "Employee delete ho gaya."
  );


  loadEmployeeList();
  loadEmployeesForReport();

}


/* EMPLOYEE DROPDOWN */

async function loadEmployeesForReport(){

  const select =
    document.getElementById("reportEmployee");


  const {data,error} =
    await supabaseClient
      .from("employees")
      .select("employee_id,name")
      .order("employee_id");


  if(error){
    return;
  }


  select.innerHTML =
    "<option value=''>All Employees</option>";


  data.forEach(function(employee){

    const option =
      document.createElement("option");

    option.value =
      employee.employee_id;

    option.textContent =
      employee.employee_id +
      " - " +
      employee.name;

    select.appendChild(option);

  });

}


/* ATTENDANCE REPORT */

async function loadReport(){

  const report =
    document.getElementById("report");

  const date =
    document.getElementById("reportDate").value;

  const employee =
    document.getElementById("reportEmployee").value;


  report.innerHTML =
    "Loading...";


  let query =
    supabaseClient
      .from("attendance")
      .select("*")
      .eq("attendance_date",date)
      .order("created_at",{ascending:false});


  if(employee){

    query =
      query.eq(
        "employee_id",
        employee
      );

  }


  const {data,error} =
    await query;


  if(error){

    report.innerHTML =
      "<span class='error'>" +
      "Report load nahi hui: " +
      error.message +
      "</span>";

    return;
  }


  if(!data || data.length===0){

    report.innerHTML =
      "<p>No attendance found.</p>";

    return;
  }


  let html =
    "<table>" +

    "<tr>" +
    "<th>Employee</th>" +
    "<th>Type</th>" +
    "<th>Time</th>" +
    "<th>Distance</th>" +
    "</tr>";


  data.forEach(function(row){

    const time =
      new Date(
        row.created_at
      ).toLocaleTimeString();


    html +=

      "<tr>" +

      "<td>" +
      row.employee_id +
      "<br>" +
      row.employee_name +
      "</td>" +

      "<td>" +
      row.attendance_type +
      "</td>" +

      "<td>" +
      time +
      "</td>" +

      "<td>" +
      Math.round(
        row.distance_meters
      ) +
      " m" +
      "</td>" +

      "</tr>";

  });


  html +=
    "</table>";


  report.innerHTML =
    html;

}

</script>

</body>
</html>
